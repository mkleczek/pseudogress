[package]
name = "pseudogress"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Simulates many virtual PostgreSQL databases, to load-test PostgreSQL clients"
repository = "https://github.com/mkleczek/pseudogress"

[dependencies]
arc-swap = "1.9.3"
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
hmac = "0.13.0"
humantime-serde = "1.1.1"
libc = "0.2.191"
pbkdf2 = "0.13.0"
pgwire = { version = "0.42", default-features = false }
postgres-protocol = "0.6.12"
rand = "0.10.3"
rlimit = "0.11.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"

[dev-dependencies]
rcgen = "0.14.10"
tokio-postgres = "0.7.18"

# The tests make thousands of SCRAM handshakes on both ends, and unoptimized
# PBKDF2 keeps every core busy for seconds, which makes the timing tests that
# run alongside them late. pseudogress' own code stays unoptimized, for
# debugging.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
